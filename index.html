<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ВЕБСАЙТ.ПРО — вход</title><style>body{font-family:Arial;background:#f7f9fc;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:32px;border-radius:18px;box-shadow:0 16px 50px #18304b14;width:min(92vw,360px)}input,button{width:100%;padding:13px;border-radius:10px;font:inherit;box-sizing:border-box}input{border:1px solid #cdd5df}button{margin-top:12px;background:#2d6cff;color:#fff;border:0;font-weight:700}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.err{color:#b42318;min-height:20px}</style><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#2d6cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ВЕБСАЙТ.ПРО"></head><body><main class="card"><h1>ВЕБСАЙТ.ПРО</h1><p>Введите ПИН для просмотра текущих проектов</p><form id="f"><input id="p" type="password" inputmode="numeric" maxlength="4" required><button>Открыть</button></form><p id="e" class="err"></p></main><script>const k='websait-access-until',day=86400000;function openD(){let x=document.createElement('iframe');x.src='dashboard.html?v='+Date.now();document.body.replaceChildren(x)}let t=+localStorage.getItem(k)||0;if(t>Date.now())openD();else document.getElementById('f').onsubmit=function(ev){ev.preventDefault();if(document.getElementById('p').value==='1504'){localStorage.setItem(k,Date.now()+day);openD()}else document.getElementById('e').textContent='Неверный ПИН-код.'}</script></body></html>
